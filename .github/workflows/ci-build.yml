name: "CI Build"

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-branches:
    name: "Check Pull Request Conditions"
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-slim' }}
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    env:
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - name: Check that the source branch is not main
        run: |
          if [ "$HEAD_REF" == "main" ] && [ "$BASE_REF" == "main" ]; then
            echo "::error::Pull requests to main must come from a branch that is not named 'main'."
            exit 1
          fi
          echo "Source branch '$HEAD_REF' is valid."
      - name: Check that the branch name only uses allowed characters
        run: |
          if ! LC_ALL=C grep -qE '^[A-Za-z0-9._+/-]+$' <<< "$HEAD_REF"; then
            echo "::error::Branch name '$HEAD_REF' may only contain A-Z, a-z, 0-9, '.', '_', '-', '+' and '/' (no umlauts or spaces)."
            exit 1
          fi
          echo "Branch name '$HEAD_REF' is valid."
      - name: Check that external pull requests do not modify .github
        if: github.event.pull_request.head.repo.full_name != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          CHANGED=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' | grep -E '^\.github/' || true)
          if [ -n "$CHANGED" ]; then
            echo "::error::Pull requests from forks must not modify files in .github/:"
            echo "$CHANGED"
            exit 1
          fi
          echo "No changes in .github/"

  run-tests:
    name: Node.js ${{ matrix.node-version }} Build
    needs: check-branches
    # check-branches only runs for pull requests and is skipped on push
    if: ${{ !cancelled() && (needs.check-branches.result == 'success' || needs.check-branches.result == 'skipped') }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [current, lts/*]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Free disk space on runner
        if: runner.environment == 'github-hosted'
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f
          echo "After cleanup:"
          df -h /
      - name: Build REMSFAL
        uses: remsfal/.github/.github/actions/build-frontend@main
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run Unit Test with Vitest (test)
        run: npm run coverage:unit
      - name: Run E2E Test with Cypress (test)
        run: npm run coverage:e2e
      - name: Check style with ESLint (lint)
        run: npm run lint
      - name: Check css with Stylelint (stylelint)
        run: npm run stylelint

      # Generate reports for Sonar Analysis (only in the upstream repository)
      - name: Build Coverage Report (only on LTS version)
        if: ${{ matrix.node-version == 'lts/*' && github.repository == 'remsfal/remsfal-frontend' }}
        run: npm run coverage:merge
      - name: Upload Coverage Reports (only on LTS version)
        if: ${{ matrix.node-version == 'lts/*' && github.repository == 'remsfal/remsfal-frontend' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          # coverage-vitest/ and coverage-cypress/ hold each tool's own lcov.info,
          # unmerged. Sonar unions per-line hit counts across separate reports itself,
          # which is robust to Vitest and Cypress instrumenting the same .vue file with
          # different AST shapes - nyc's merge (coverage/) instead concatenates their
          # function/branch/line tables unreconciled, inflating the denominator on any
          # component no e2e spec visits. coverage/ is kept for now until the CI/merge
          # step itself is cleaned up.
          path: |
            coverage/
            coverage-vitest/lcov.info
            coverage-cypress/lcov.info
          retention-days: 1
          if-no-files-found: error
      - name: Build ESLint Report (only on LTS version)
        if: ${{ matrix.node-version == 'lts/*' && github.repository == 'remsfal/remsfal-frontend' }}
        run: npm run lint:report
      - name: Upload ESLint Reports (only on LTS version)
        if: ${{ matrix.node-version == 'lts/*' && github.repository == 'remsfal/remsfal-frontend' }}
        uses: actions/upload-artifact@v7
        with:
          name: eslint-${{ github.run_id }}
          path: reports/
          retention-days: 1
          if-no-files-found: error
