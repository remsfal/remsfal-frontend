name: CD Build

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: ${{ github.repository }}

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  build-and-push-to-registry:
    name: Build and Deploy Docker Image
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Only run in repositories of the REMSFAL organization, not in personal forks
    if: github.repository_owner == 'remsfal'
    # Repositories with their own registry set CD_ENVIRONMENT (e.g. staging), which provides
    # REGISTRY_HOST, REGISTRY_USERNAME and REGISTRY_PASSWORD. Without it, images go to ghcr.io.
    environment: ${{ vars.CD_ENVIRONMENT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v6
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-${{ runner.os }}-
      - name: List the state of node modules
        if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: npm list

      - name: Install dependencies
        run: npm ci

      - name: Determine version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Run build
        run: npm run build

      - name: Login to Container Registry
        uses: docker/login-action@v4.7.0
        with:
            registry: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
            username: ${{ vars.REGISTRY_USERNAME || github.actor }}
            password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

        # Should we use cache-from and cache-to here for speed up?
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
            context: .
            file: ./docker/Dockerfile
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
      - name: Generate artifact attestation
        # Artifact attestations for private repositories require GitHub Enterprise Cloud
        if: ${{ !github.event.repository.private }}
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true