sonar.projectKey=remsfal_remsfal-frontend
sonar.organization=remsfal

# Sonar unions per-line hit counts across multiple LCOV reports itself, which is robust
# against Vitest and Cypress instrumenting the same .vue file with different AST shapes.
# Do not merge the reports beforehand (e.g. with nyc): a merge concatenates the two tools'
# function/branch/line tables for a file without reconciling them, which roughly doubles
# the denominator and tanks reported coverage on components with full unit test coverage.
sonar.javascript.lcov.reportPaths=coverage-vitest/lcov.info,coverage-cypress/lcov.info
# Disable eslint reporting for sonar, because ruleESLintKeys() are null
# sonar.eslint.reportPaths=reports/eslint-report.json
sonar.coverage.exclusions=plugins/**/*, test/**/*, cypress/**/*, *.config.*
sonar.cpd.exclusions=src/services/api/*, cypress/**/*, test/**/*, *.config.*
sonar.exclusions=android/**, ios/**, scripts/**

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=remsfal-frontend
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=src

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
